name: Apparent feedback
description: Report a bug or suggest an improvement. A screen recording can help, but is optional.
title: ""
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Apparent. Review any capture before attaching it: videos, screenshots and transcripts may contain private information. Apparent never uploads your recording automatically.
  - type: dropdown
    id: kind
    attributes:
      label: What kind of feedback is this?
      options:
        - Bug
        - Improvement idea
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened, or what would you change?
      description: Tell us what you were doing and what you expected instead.
      placeholder: I tried to… I expected… Instead…
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it? (optional)
      description: Steps, OS, Apparent version, or anything else that helps.
  - type: textarea
    id: media
    attributes:
      label: Screenshots or recording (optional)
      description: Drag in a reviewed image or video if it helps. Remove private information first.
