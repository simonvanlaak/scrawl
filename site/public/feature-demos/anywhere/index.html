const stage=document.querySelector('#stage'),surfaces=[...document.querySelectorAll('.surface')],subtitle=document.querySelector('#subtitle'),clock=document.querySelector('#timer'),play=document.querySelector('#play'),status=document.querySelector('#status'),reduce=matchMedia('(prefers-reduced-motion:reduce)');let running=!reduce.matches,timers=[],ticker=null,index=0,elapsed=0,resume=false;const lines=['“Make this heading a little clearer.”','“This row needs more space.”','“And this ghost should look more like this.”'];const labels=['Website','App','Agent preview'];
